name: Validate and package Persistent-Agent

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install '.[signing]'
      - name: Run regression checks
        run: python -m unittest -v
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify installed wheel outside source checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          smoke_dir=$(mktemp -d)
          cp examples/agent-identity.example.json "$smoke_dir/input.json"
          cd "$smoke_dir"
          python -m persistent_agent snapshot input.json --output identity.json
          python -m persistent_agent validate identity.json
      - name: Upload installable wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: persistent-agent-python-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
